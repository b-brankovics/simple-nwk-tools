name: simple-nwk-tools
channels:
  - conda-forge
  - bioconda
  - b-brankovics
  - defaults
dependencies:
  - python=3.9
  - conda-forge::ete3
  - conda-forge::numpy
  - conda-forge::pyqt
  - conda-forge::pyaml
variables:
  QT_QPA_PLATFORM: offscreen
  QT_QPA_PLATFORM_PLUGIN_PATH: $CONDA_PREFIX/plugins/platforms
